<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sleep">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Sleep Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      padding-top: env(safe-area-inset-top, 20px);
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 18px; opacity: 0.6; }
    .sync-status { font-size: 12px; opacity: 0.5; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
    .sync-dot.synced { background: #4ecca3; }
    .sync-dot.syncing { background: #f0a500; animation: pulse 1s infinite; }
    .sync-dot.error { background: #e94560; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .label { font-size: 15px; opacity: 0.7; margin-bottom: 4px; }
    .date-label { font-size: 13px; opacity: 0.5; margin-bottom: 12px; }
    .buttons { display: flex; gap: 12px; }
    .btn {
      flex: 1;
      padding: 28px 0;
      font-size: 22px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn.yes { background: #e94560; color: #fff; }
    .btn.no { background: #0f3460; color: #fff; }
    .btn.selected { outline: 3px solid #fff; }
    .btn.faded { opacity: 0.4; }
    .status {
      text-align: center;
      font-size: 13px;
      opacity: 0.5;
      margin-top: 8px;
      min-height: 18px;
    }
    .history { margin-top: 24px; }
    .history h2 { font-size: 14px; opacity: 0.5; margin-bottom: 12px; }
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px;
      margin-bottom: 8px;
      background: #16213e;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .history-row:active { background: #1f2b4d; }
    .history-row span { opacity: 0.7; }
    .dots { display: flex; align-items: center; gap: 12px; }
    .dot-group { display: flex; align-items: center; gap: 4px; font-size: 12px; opacity: 0.6; }
    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.yes { background: #e94560; }
    .dot.no { background: #4ecca3; }
    .dot.none { background: #333; }
    .export-btn {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: transparent;
      border: 1px solid #ffffff30;
      color: #fff;
      opacity: 0.5;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .export-btn:active { opacity: 0.8; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #16213e;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
    }
    .modal h3 { font-size: 18px; margin-bottom: 20px; text-align: center; }
    .modal .card { background: #0f2847; margin-bottom: 12px; padding: 16px; }
    .modal .btn { padding: 20px 0; font-size: 18px; }
    .modal .close-btn {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }
    .modal input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ffffff30;
      border-radius: 10px;
      background: #0f2847;
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .modal input::placeholder { color: #ffffff50; }
    .modal p { font-size: 13px; opacity: 0.6; margin-bottom: 16px; line-height: 1.5; }
    .modal .danger-btn {
      background: transparent;
      border: 1px solid #e94560;
      color: #e94560;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Sleep Tracker</h1>
    <div class="sync-status" onclick="openSettings()">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-text">Not synced</span>
    </div>
  </div>

  <div class="card">
    <div class="label">Ate within 2hrs of bed?</div>
    <div class="date-label" id="ate-date"></div>
    <div class="buttons">
      <button class="btn yes" onclick="record('ate', true)">Yes</button>
      <button class="btn no" onclick="record('ate', false)">No</button>
    </div>
    <div class="status" id="ate-status"></div>
  </div>

  <div class="card">
    <div class="label">Tired this morning?</div>
    <div class="date-label" id="tired-date"></div>
    <div class="buttons">
      <button class="btn yes" onclick="record('tired', true)">Yes</button>
      <button class="btn no" onclick="record('tired', false)">No</button>
    </div>
    <div class="status" id="tired-status"></div>
  </div>

  <div class="history">
    <h2>Previous days (tap to edit)</h2>
    <div id="history-list"></div>
  </div>

  <button class="export-btn" onclick="exportData()">Copy all data</button>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 id="modal-title"></h3>
      <div class="card">
        <div class="label">Ate within 2hrs of bed?</div>
        <div class="buttons">
          <button class="btn yes" id="modal-ate-yes" onclick="recordModal('ate', true)">Yes</button>
          <button class="btn no" id="modal-ate-no" onclick="recordModal('ate', false)">No</button>
        </div>
      </div>
      <div class="card">
        <div class="label">Tired that morning?</div>
        <div class="buttons">
          <button class="btn yes" id="modal-tired-yes" onclick="recordModal('tired', true)">Yes</button>
          <button class="btn no" id="modal-tired-no" onclick="recordModal('tired', false)">No</button>
        </div>
      </div>
      <button class="close-btn" onclick="closeModal()">Done</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal" onclick="closeSettings(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Sync Settings</h3>
      <p>Create a GitHub personal access token with "gist" scope at github.com/settings/tokens</p>
      <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
      <button class="close-btn" onclick="saveToken()">Save & Sync</button>
      <button class="close-btn danger-btn" id="disconnect-btn" onclick="disconnect()" style="display:none">Disconnect</button>
      <button class="close-btn" onclick="closeSettings()">Cancel</button>
    </div>
  </div>

  <script>
    let editingDate = null;
    let syncTimeout = null;

    const toLocalDateStr = (d) => {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };

    const getToday = () => toLocalDateStr(new Date());

    const formatDate = (date) => {
      const [y, m, d] = date.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    };

    const getAllData = () => {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('ate-') || key.startsWith('tired-')) {
          data[key] = JSON.parse(localStorage.getItem(key));
        }
      }
      return data;
    };

    const setAllData = (data) => {
      Object.entries(data).forEach(([key, value]) => {
        localStorage.setItem(key, JSON.stringify(value));
      });
    };

    // Sync functions
    const updateSyncStatus = (status, text) => {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-text');
      dot.className = 'sync-dot ' + status;
      label.textContent = text;
    };

    const syncToGist = async () => {
      const token = localStorage.getItem('gh_token');
      const gistId = localStorage.getItem('gh_gist_id');
      if (!token) return;

      updateSyncStatus('syncing', 'Syncing...');

      const data = getAllData();
      const content = JSON.stringify(data, null, 2);

      try {
        if (gistId) {
          // Update existing gist
          const res = await fetch(`https://api.github.com/gists/${gistId}`, {
            method: 'PATCH',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              files: { 'sleep-tracker.json': { content } }
            })
          });
          if (!res.ok) throw new Error('Failed to update');
        } else {
          // Create new gist
          const res = await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              description: 'Sleep Tracker Data',
              public: false,
              files: { 'sleep-tracker.json': { content } }
            })
          });
          if (!res.ok) throw new Error('Failed to create');
          const gist = await res.json();
          localStorage.setItem('gh_gist_id', gist.id);
        }
        updateSyncStatus('synced', 'Synced');
      } catch (e) {
        console.error(e);
        updateSyncStatus('error', 'Sync failed');
      }
    };

    const fetchFromGist = async () => {
      const token = localStorage.getItem('gh_token');
      const gistId = localStorage.getItem('gh_gist_id');
      if (!token || !gistId) return;

      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { 'Authorization': `token ${token}` }
        });
        if (!res.ok) return;
        const gist = await res.json();
        const content = gist.files['sleep-tracker.json']?.content;
        if (content) {
          const data = JSON.parse(content);
          setAllData(data);
          updateUI();
        }
        updateSyncStatus('synced', 'Synced');
      } catch (e) {
        console.error(e);
      }
    };

    const scheduleSync = () => {
      if (syncTimeout) clearTimeout(syncTimeout);
      syncTimeout = setTimeout(syncToGist, 1000);
    };

    const record = (type, value) => {
      const date = getToday();
      const key = `${type}-${date}`;
      localStorage.setItem(key, JSON.stringify({ value, time: Date.now() }));
      updateUI();
      scheduleSync();
    };

    const recordModal = (type, value) => {
      if (!editingDate) return;
      const key = `${type}-${editingDate}`;
      localStorage.setItem(key, JSON.stringify({ value, time: Date.now() }));
      updateModalUI();
      updateUI();
      scheduleSync();
    };

    const getData = (type, date) => {
      const key = `${type}-${date}`;
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : null;
    };

    const formatTime = (ts) => {
      return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    };

    const updateUI = () => {
      const today = getToday();

      document.getElementById('ate-date').textContent = `For tonight — ${formatDate(today)}`;
      document.getElementById('tired-date').textContent = `For this morning — ${formatDate(today)}`;

      ['ate', 'tired'].forEach(type => {
        const data = getData(type, today);
        const status = document.getElementById(`${type}-status`);
        const btns = status.parentElement.querySelectorAll('.btn');

        btns.forEach(btn => btn.classList.remove('selected', 'faded'));

        if (data) {
          status.textContent = `Logged at ${formatTime(data.time)}`;
          btns.forEach(btn => {
            const isYes = btn.classList.contains('yes');
            if (isYes === data.value) btn.classList.add('selected');
            else btn.classList.add('faded');
          });
        } else {
          status.textContent = '';
        }
      });

      const list = document.getElementById('history-list');
      list.innerHTML = '';
      for (let i = 1; i <= 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const date = toLocalDateStr(d);
        const ate = getData('ate', date);
        const tired = getData('tired', date);

        const row = document.createElement('div');
        row.className = 'history-row';
        row.onclick = () => openModal(date);
        row.innerHTML = `
          <span>${formatDate(date)}</span>
          <div class="dots">
            <div class="dot-group">Ate <span class="dot ${ate ? (ate.value ? 'yes' : 'no') : 'none'}"></span></div>
            <div class="dot-group">Tired <span class="dot ${tired ? (tired.value ? 'yes' : 'no') : 'none'}"></span></div>
          </div>
        `;
        list.appendChild(row);
      }

      // Update sync status display
      const token = localStorage.getItem('gh_token');
      if (!token) {
        updateSyncStatus('', 'Tap to sync');
      }
    };

    const openModal = (date) => {
      editingDate = date;
      document.getElementById('modal-title').textContent = formatDate(date);
      document.getElementById('modal').classList.add('active');
      updateModalUI();
    };

    const updateModalUI = () => {
      if (!editingDate) return;

      ['ate', 'tired'].forEach(type => {
        const data = getData(type, editingDate);
        const yesBtn = document.getElementById(`modal-${type}-yes`);
        const noBtn = document.getElementById(`modal-${type}-no`);

        [yesBtn, noBtn].forEach(btn => btn.classList.remove('selected', 'faded'));

        if (data) {
          if (data.value) {
            yesBtn.classList.add('selected');
            noBtn.classList.add('faded');
          } else {
            noBtn.classList.add('selected');
            yesBtn.classList.add('faded');
          }
        }
      });
    };

    const closeModal = (e) => {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modal').classList.remove('active');
      editingDate = null;
    };

    const openSettings = () => {
      const token = localStorage.getItem('gh_token');
      document.getElementById('token-input').value = token || '';
      document.getElementById('disconnect-btn').style.display = token ? 'block' : 'none';
      document.getElementById('settings-modal').classList.add('active');
    };

    const closeSettings = (e) => {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('settings-modal').classList.remove('active');
    };

    const saveToken = async () => {
      const token = document.getElementById('token-input').value.trim();
      if (!token) return;
      localStorage.setItem('gh_token', token);
      closeSettings();
      await syncToGist();
    };

    const disconnect = () => {
      localStorage.removeItem('gh_token');
      localStorage.removeItem('gh_gist_id');
      updateSyncStatus('', 'Tap to sync');
      closeSettings();
    };

    const exportData = async () => {
      const data = getAllData();
      const json = JSON.stringify(data, null, 2);
      try {
        await navigator.clipboard.writeText(json);
        document.querySelector('.export-btn').textContent = 'Copied!';
        setTimeout(() => {
          document.querySelector('.export-btn').textContent = 'Copy all data';
        }, 2000);
      } catch (e) {
        alert(json);
      }
    };

    // Init
    updateUI();
    fetchFromGist();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
