<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sleep">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Sleep Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      padding-top: env(safe-area-inset-top, 20px);
    }
    h1 { font-size: 18px; text-align: center; opacity: 0.6; margin-bottom: 24px; }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .label { font-size: 15px; opacity: 0.7; margin-bottom: 4px; }
    .date-label { font-size: 13px; opacity: 0.5; margin-bottom: 12px; }
    .buttons { display: flex; gap: 12px; }
    .btn {
      flex: 1;
      padding: 28px 0;
      font-size: 22px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn.yes { background: #e94560; color: #fff; }
    .btn.no { background: #0f3460; color: #fff; }
    .btn.selected { outline: 3px solid #fff; }
    .btn.faded { opacity: 0.4; }
    .status {
      text-align: center;
      font-size: 13px;
      opacity: 0.5;
      margin-top: 8px;
      min-height: 18px;
    }
    .history { margin-top: 24px; }
    .history h2 { font-size: 14px; opacity: 0.5; margin-bottom: 12px; }
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px;
      margin-bottom: 8px;
      background: #16213e;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .history-row:active { background: #1f2b4d; }
    .history-row span { opacity: 0.7; }
    .dots { display: flex; align-items: center; gap: 12px; }
    .dot-group { display: flex; align-items: center; gap: 4px; font-size: 12px; opacity: 0.6; }
    .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.yes { background: #e94560; }
    .dot.no { background: #4ecca3; }
    .dot.none { background: #333; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #16213e;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
    }
    .modal h3 { font-size: 18px; margin-bottom: 20px; text-align: center; }
    .modal .card { background: #0f2847; margin-bottom: 12px; padding: 16px; }
    .modal .btn { padding: 20px 0; font-size: 18px; }
    .modal .close-btn {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Sleep Tracker</h1>

  <div class="card">
    <div class="label">Ate within 2hrs of bed?</div>
    <div class="date-label" id="ate-date"></div>
    <div class="buttons">
      <button class="btn yes" onclick="record('ate', true)">Yes</button>
      <button class="btn no" onclick="record('ate', false)">No</button>
    </div>
    <div class="status" id="ate-status"></div>
  </div>

  <div class="card">
    <div class="label">Tired this morning?</div>
    <div class="date-label" id="tired-date"></div>
    <div class="buttons">
      <button class="btn yes" onclick="record('tired', true)">Yes</button>
      <button class="btn no" onclick="record('tired', false)">No</button>
    </div>
    <div class="status" id="tired-status"></div>
  </div>

  <div class="history">
    <h2>Previous days (tap to edit)</h2>
    <div id="history-list"></div>
  </div>

  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 id="modal-title"></h3>
      <div class="card">
        <div class="label">Ate within 2hrs of bed?</div>
        <div class="buttons">
          <button class="btn yes" id="modal-ate-yes" onclick="recordModal('ate', true)">Yes</button>
          <button class="btn no" id="modal-ate-no" onclick="recordModal('ate', false)">No</button>
        </div>
      </div>
      <div class="card">
        <div class="label">Tired that morning?</div>
        <div class="buttons">
          <button class="btn yes" id="modal-tired-yes" onclick="recordModal('tired', true)">Yes</button>
          <button class="btn no" id="modal-tired-no" onclick="recordModal('tired', false)">No</button>
        </div>
      </div>
      <button class="close-btn" onclick="closeModal()">Done</button>
    </div>
  </div>

  <script>
    let editingDate = null;

    const toLocalDateStr = (d) => {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };

    const getToday = () => toLocalDateStr(new Date());

    const formatDate = (date) => {
      const [y, m, d] = date.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    };

    const record = (type, value) => {
      const date = getToday();
      const key = `${type}-${date}`;
      localStorage.setItem(key, JSON.stringify({ value, time: Date.now() }));
      updateUI();
    };

    const recordModal = (type, value) => {
      if (!editingDate) return;
      const key = `${type}-${editingDate}`;
      localStorage.setItem(key, JSON.stringify({ value, time: Date.now() }));
      updateModalUI();
      updateUI();
    };

    const getData = (type, date) => {
      const key = `${type}-${date}`;
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : null;
    };

    const formatTime = (ts) => {
      return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    };

    const updateUI = () => {
      const today = getToday();

      // Set date labels
      document.getElementById('ate-date').textContent = `For tonight — ${formatDate(today)}`;
      document.getElementById('tired-date').textContent = `For this morning — ${formatDate(today)}`;

      ['ate', 'tired'].forEach(type => {
        const data = getData(type, today);
        const status = document.getElementById(`${type}-status`);
        const btns = status.parentElement.querySelectorAll('.btn');

        btns.forEach(btn => btn.classList.remove('selected', 'faded'));

        if (data) {
          status.textContent = `Logged at ${formatTime(data.time)}`;
          btns.forEach(btn => {
            const isYes = btn.classList.contains('yes');
            if (isYes === data.value) btn.classList.add('selected');
            else btn.classList.add('faded');
          });
        } else {
          status.textContent = '';
        }
      });

      // History
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      for (let i = 1; i <= 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const date = toLocalDateStr(d);
        const ate = getData('ate', date);
        const tired = getData('tired', date);

        const row = document.createElement('div');
        row.className = 'history-row';
        row.onclick = () => openModal(date);
        row.innerHTML = `
          <span>${formatDate(date)}</span>
          <div class="dots">
            <div class="dot-group">Ate <span class="dot ${ate ? (ate.value ? 'yes' : 'no') : 'none'}"></span></div>
            <div class="dot-group">Tired <span class="dot ${tired ? (tired.value ? 'yes' : 'no') : 'none'}"></span></div>
          </div>
        `;
        list.appendChild(row);
      }
    };

    const openModal = (date) => {
      editingDate = date;
      document.getElementById('modal-title').textContent = formatDate(date);
      document.getElementById('modal').classList.add('active');
      updateModalUI();
    };

    const updateModalUI = () => {
      if (!editingDate) return;

      ['ate', 'tired'].forEach(type => {
        const data = getData(type, editingDate);
        const yesBtn = document.getElementById(`modal-${type}-yes`);
        const noBtn = document.getElementById(`modal-${type}-no`);

        [yesBtn, noBtn].forEach(btn => btn.classList.remove('selected', 'faded'));

        if (data) {
          if (data.value) {
            yesBtn.classList.add('selected');
            noBtn.classList.add('faded');
          } else {
            noBtn.classList.add('selected');
            yesBtn.classList.add('faded');
          }
        }
      });
    };

    const closeModal = (e) => {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modal').classList.remove('active');
      editingDate = null;
    };

    updateUI();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
